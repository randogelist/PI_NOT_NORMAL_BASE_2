name: Lean C_t verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'randogelist/PI_NOT_NORMAL_BASE_2'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Start fresh hosted verification evidence
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json, os, pathlib, shutil
          shutil.rmtree("verification", ignore_errors=True)
          pathlib.Path("verification").mkdir()
          pathlib.Path("verification/CI_RUN.json").write_text(json.dumps({
              "status": "SETUP_PENDING", "commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"]
          }, indent=2) + "\n")
          PYCODE

      - name: Install exact Lean 4.33.0 release
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/lean-4.33.0-linux.tar.zst"
          curl --fail --location --retry 3 \
            https://github.com/leanprover/lean4/releases/download/v4.33.0/lean-4.33.0-linux.tar.zst \
            --output "$archive"
          echo "4b3fb03c29a1e0a253fb1d11f9bae3725f19a0dc6fc09b3ea16d2c9df3349e2c  $archive" | sha256sum --check --strict
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.33.0-linux/bin" >> "$GITHUB_PATH"

      - name: Restore compatible Mathlib cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .lake/packages
          key: mathlib-${{ runner.os }}-lean-4.33.0-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}

      - name: Fetch pinned dependencies and Mathlib artifacts
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = db584cd6d46c92f209a44c0f1c829460d327499d

      - name: Restore verified project artifacts
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .verify
          key: project-${{ runner.os }}-lean-4.33.0-${{ hashFiles('lake-manifest.json', 'scripts/**') }}-${{ github.sha }}
          restore-keys: |
            project-${{ runner.os }}-lean-4.33.0-${{ hashFiles('lake-manifest.json', 'scripts/**') }}-

      - name: Verify rejection of unsupported assumptions
        run: python3 scripts/test_verifier.py

      - name: Compile all source branches and audit all declarations
        run: python3 scripts/verify.py --mathlib .lake/packages/mathlib

      - name: Record hosted job outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PYCODE'
          import json, os, pathlib
          path = pathlib.Path("verification/CI_RUN.json")
          path.parent.mkdir(exist_ok=True)
          data = json.loads(path.read_text()) if path.exists() else {}
          data.update(status=os.environ["JOB_STATUS"], commit=os.environ["GITHUB_SHA"], run_id=os.environ["GITHUB_RUN_ID"])
          path.write_text(json.dumps(data, indent=2) + "\n")
          PYCODE

      - name: Upload exact verification receipt and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lean-ct-verification-${{ github.sha }}
          path: verification/
          if-no-files-found: error
          retention-days: 30
